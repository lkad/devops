name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Lint
        run: make ci-lint

      - name: Build
        run: make ci-build

      - name: Test (with coverage gate)
        run: make ci-test

      - name: Load test smoke
        # 50 VUs / 20s — same thresholds as the dev box.
        # -race + -count=1 is implied by ci-test already;
        # load test is separate so a slow CI machine does
        # not fail on flaky timing.
        run: |
          go build ./tests/load/... && \
          go test -tags=load -run TestLoadPhysicalHosts -timeout 90s ./tests/load/... -v

      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

