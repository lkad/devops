# Dev environment config
#
# Environment variables (all optional in dev; defaults shown below):
#   APP__PORT           listen port (default 8080)
#   APP__HOST           listen address (default 0.0.0.0)
#   APP__LOG_LEVEL      debug|info|warn|error (default debug)
#   DATABASE__DSN       sqlite path (default tests/fixtures/db/dev.db)
#   LOGS__BACKEND       local|elasticsearch|loki (default local)
#   LOGS__LOCAL__PATH   log dir for the local backend (default tests/fixtures/logs)
#   LDAP__DEV_BYPASS    true|false (default true; never set false in dev)
#
# Override any value with the env var of the dotted-path uppercased with
# double underscores, e.g. APP__PORT=9090 ./bin/devops-toolkit.

app:
  name: devops-toolkit
  env: dev
  host: 0.0.0.0
  port: 8080
  log_level: debug

database:
  driver: sqlite
  dsn: tests/fixtures/db/dev.db
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 300  # seconds

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

logs:
  backend: local
  local:
    path: tests/fixtures/logs
  elasticsearch:
    url: ""
    username: ""
    password: ""
  loki:
    url: ""

ldap:
  url: ""
  bind_dn: ""
  bind_password: ""
  base_dn: ""
  user_filter: ""
  dev_bypass: true
  dev_users:
    - username: admin
      password: admin
      role: SuperAdmin
    - username: viewer
      password: viewer
      role: Auditor

alerts:
  channels: []
  suppression:
    enable_in_maintenance: true

k8s:
  default_namespace: default
  in_cluster: false
  kubeconfig_path: ""

physicalhost:
  monitoring_interval: 30  # seconds
  ssh_timeout: 10

websocket:
  ping_interval: 30  # seconds
  write_timeout: 10
  read_timeout: 60
