server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://192.168.121.111:3100/loki/api/v1/push

scrape_configs:
  - job_name: pod-logs
    static_configs:
      - targets:
          - localhost
        labels:
          __path__: /var/log/pods/default_log-tester-*/log-tester/*.log
          cluster: dev-cluster-1
          namespace: default
          pod: log-tester
