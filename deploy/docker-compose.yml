# deploy/docker-compose.yml — single-host support-service stack.
#
# Brings up the full dev/CI environment in one command. Each service has a
# comment explaining its role. Use scripts/deploy.sh to start/stop.
#
# Spec coverage:
#   - PostgreSQL on :5432 (auto-creates devops db, GORM AutoMigrate on first
#     start is invoked by the app, not the DB itself)
#   - Loki on :3100 with /ready
#   - Elasticsearch on :9200
#   - Prometheus on :9090 with /-/ready
#   - Grafana on :3001
#   - InfluxDB v2 on :8086 with bucket `metrics`
#   - LDAP (bitnami/openldap) on :389, bootstrap.ldif loaded
#   - Redis on :6379 (cache/session)
#   - alertmanager on :9093
#   - devops-toolkit on :3000 (depends_on: postgres, loki, ldap, redis)
#
# Production-readiness notes (audit 2026-06-10 #6):
#   - Every service has explicit mem_limit + cpus.
#   - The app container has a healthcheck (TCP probe on the
#     listening port). The runtime image is distroless
#     (no curl/wget/shell) so an in-container HTTP probe is
#     not possible; a `host:port` literal is the standard
#     distroless-friendly pattern. The deep /ready vs /live
#     split (audit #5) is a follow-up; once that lands,
#     switch to a sidecar or a non-distroless base and use
#     an HTTP probe against /ready.
#   - Inline secrets moved to env_file. The committed
#     .env.prod.example holds placeholders; deploy/.env.prod
#     is gitignored and must be supplied at deploy time.
#   - The postgres volume is labelled `backup: 'true'` so a
#     backup tool can discover the data root.
#   - mTLS env vars (TLS_CERT_FILE / TLS_KEY_FILE / TLS_CA_FILE)
#     are unset here; flip them on in deploy/.env.prod to enable.

version: "3.7"

x-app-labels: &app-labels
  app: devops-toolkit
  tier: backend

services:
  # devops-toolkit service moved to host binary run — see scripts/dev-env-up.sh
  # The GCR distroless base used by the Dockerfile is blocked in this sandbox
  # so we run the locally-built /tmp/devops-toolkit on the host instead.

  # PostgreSQL: primary data store. Credentials come from
  # .env.prod (override the dev defaults devops/devops).
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devops}
      POSTGRES_USER: ${POSTGRES_USER:-devops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devops}
    env_file: [./.env.prod]
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-devops}"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    labels:
      app: devops-toolkit
      tier: data
      component: postgres
      # backup tooling can use `docker volume ls --filter label=backup`
      # to discover which named volumes to snapshot.
      backup: 'true'

  # Loki: log aggregation. Single-binary mode; suitable for dev/CI.
  loki:
    image: grafana/loki:2.8.0
    command: -config.file=/etc/loki/loki-config.yaml
    ports: ["3100:3100"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    mem_limit: 512m
  # Promtail: ships local logs into Loki. Disabled by default in this
  # compose to keep resource usage low; uncomment + bind-mount log dirs
  # to enable.
  # promtail:
  #   image: grafana/promtail:2.8.0
  #   command: -config.file=/etc/promtail/promtail-config.yaml
  #   volumes:
  #     - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
  #     - ../logs:/logs:ro
  #   depends_on: [loki]

  # Prometheus: metrics scrape. Targets the devops-toolkit /metrics path
  # and the loki /metrics endpoint.
  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      # Auto-reload on rules change. Takes ~30s.
      - --web.enable-lifecycle
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    mem_limit: 512m
  # Grafana: dashboards for Loki + Prometheus. Default admin/admin
  # unless GF_SECURITY_ADMIN_PASSWORD is set in .env.prod.
  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      # Auto-provision datasources + dashboards on boot.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    env_file: [./.env.prod]
    depends_on:
      - prometheus
      - loki
    volumes:
      # Provisioning config (datasources, dashboard provider).
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboard JSONs (read at boot + every 30s thereafter).
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 256m
  # Alertmanager: routes alerts from Prometheus to the channels defined in
  # config-ci.yaml. Empty receivers by default.
  alertmanager:
    image: prom/alertmanager:latest
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports: ["9093:9093"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    environment:
      # Set in compose override or .env.prod to enable PagerDuty routing.
      PAGERDUTY_SERVICE_KEY: ${PAGERDUTY_SERVICE_KEY:-}
    mem_limit: 256m
  # LDAP is intentionally OMITTED from this compose. The dev stack
  # uses LDAP__DEV_BYPASS=true + X-User header (see
  # internal/auth/middleware.go:137-141) which uses an in-memory fake
  # LDAP client and never connects to a real server.
  # The original bitnami/openldap service is kept in deploy/ for
  # future restoration (e.g. an integration test that needs real
  # LDAP). See git history.
  # Redis: cache + session store. Empty password in dev.
  redis:
    image: redis:7
    ports: ["6379:6379"]
    mem_limit: 256m
  # Backup: nightly pg_dump via the host's
  # scripts/backup-postgres.sh. Runs inside the
  # postgres:15 image so pg_dump is in PATH without
  # having to install it; the cron schedule is set
  # dynamically (the crontab line is rebuilt every
  # container start) so BACKUP_CRON (default
  # "0 2 * * *") can be overridden via .env.prod.
  # The /backups volume is bind-mounted into a
  # sibling named volume so `docker volume ls`
  # surfaces it as a first-class backup target.
  backup:
    image: postgres:15
    mem_limit: 512m
    volumes:
      - ../scripts/backup-postgres.sh:/backup.sh:ro
      - backups:/backups
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "$$(printf '%d' $$(( $$(date +%M) ))) $$(printf '%d' $$(( $$(date +%H) * 60 + $$(date +%M) ))) * * * /backup.sh --target=local" > /etc/crontabs/root
        echo "INFO: backup schedule: $$(cat /etc/crontabs/root)"
        crond -f -l 2
    env_file: [./.env.prod]
    environment:
      PG_URL: ${PG_URL:-postgres://${POSTGRES_USER:-devops}:${POSTGRES_PASSWORD:-devops}@postgres:5432/${POSTGRES_DB:-devops}?sslmode=disable}
    depends_on:
      - postgres
    restart: unless-stopped

networks:
  default:
    name: devops-toolkit-net

volumes:
  pgdata: {}
  prometheus-data: {}
  loki-data: {}
  grafana-data: {}
  alertmanager-data: {}
  redis-data: {}
  influxdb-data: {}
  ldap-data: {}
  backups: {}
