# deploy/docker-compose.yml — single-host support-service stack.
#
# Brings up the full dev/CI environment in one command. Each service has a
# comment explaining its role. Use scripts/deploy.sh to start/stop.
#
# Spec coverage:
#   - PostgreSQL on :5432 (auto-creates devops db, GORM AutoMigrate on first
#     start is invoked by the app, not the DB itself)
#   - Loki on :3100 with /ready
#   - Elasticsearch on :9200
#   - Prometheus on :9090 with /-/ready
#   - Grafana on :3001
#   - InfluxDB v2 on :8086 with bucket `metrics`
#   - LDAP (bitnami/openldap) on :389, bootstrap.ldif loaded
#   - Redis on :6379 (cache/session)
#   - alertmanager on :9093
#   - devops-toolkit on :3000 (depends_on: postgres, loki, ldap, redis)
#
# Production-readiness notes (audit 2026-06-10 #6):
#   - Every service has explicit mem_limit + cpus.
#   - The app container has a healthcheck (TCP probe on the
#     listening port). The runtime image is distroless
#     (no curl/wget/shell) so an in-container HTTP probe is
#     not possible; a `host:port` literal is the standard
#     distroless-friendly pattern. The deep /ready vs /live
#     split (audit #5) is a follow-up; once that lands,
#     switch to a sidecar or a non-distroless base and use
#     an HTTP probe against /ready.
#   - Inline secrets moved to env_file. The committed
#     .env.prod.example holds placeholders; deploy/.env.prod
#     is gitignored and must be supplied at deploy time.
#   - The postgres volume is labelled `backup: 'true'` so a
#     backup tool can discover the data root.
#   - mTLS env vars (TLS_CERT_FILE / TLS_KEY_FILE / TLS_CA_FILE)
#     are unset here; flip them on in deploy/.env.prod to enable.

version: "3.8"

x-app-labels: &app-labels
  app: devops-toolkit
  tier: backend

services:
  # Application: the devops-toolkit API server. Built locally; see
  # scripts/ci-build.sh.
  devops-toolkit:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: devops-toolkit:local
    environment:
      # APP__ENV=dev (not production) so the dev stack can use
      # ldap.dev_bypass + the in-memory JWT secret fallback without
      # tripping the prod refusal in internal/config/config.go:213-228.
      # For production deploys, override this in deploy/.env.prod.
      APP__ENV: dev
      APP__PORT: 3000
      DATABASE__DRIVER: postgres
      # DATABASE__URL, APP__JWT_SECRET, etc. are loaded from
      # .env.prod (see env_file below). The defaults below match
      # dev/CI; .env.prod overrides them.
      LOGS__BACKEND: loki
      LOGS__LOKI__URL: http://loki:3100
      REDIS__HOST: redis
      # dev_bypass lets scripts/seed-data.sh + scripts/dev-env-up.sh
      # authenticate with just `X-User: alice` (see
      # internal/auth/middleware.go:137-141). No JWT needed.
      LDAP__DEV_BYPASS: "true"
      # SSH prober. Mounted from deploy/secrets/prober/ below; the
      # matching public key is injected into the containerlab
      # topology's PUBLIC_KEY env so the linuxserver/openssh-server
      # container accepts our key. See scripts/dev-env-up.sh.
      PROBER_SSH_KEY: /etc/devops-toolkit/prober/id_ed25519
      PROBER_SSH_TIMEOUT: 5s
    env_file:
      - path: ./.env.prod
        required: false
    volumes:
      # Read-only mount of the prober's ed25519 private key.
      # Generated locally with ssh-keygen — see
      # deploy/secrets/prober/README.md (private key is gitignored).
      - ../deploy/secrets/prober:/etc/devops-toolkit/prober:ro
    ports: ["3000:3000"]
    depends_on:
      - postgres
      - loki
      - ldap
      - redis
    restart: unless-stopped
    # Resource limits: tune from baseline.md load-test data. With
    # 200 VUs sustained at <1% CPU the headroom is generous; the
    # limits exist to stop a runaway pod from starving the host.
    mem_limit: 512m
    cpus: '1.0'
    # healthcheck: the runtime image is distroless, so no
    # curl/wget/shell exists in the container. A `host:port`
    # short-form test makes Docker perform a TCP connect
    # into the published port from the host network — this
    # proves the process is up and the listener is bound,
    # but does NOT verify DB / LDAP / K8s reachability.
    # Audit #5 (deep /ready vs /live) is the follow-up.
    # start_period covers the 30s AutoMigrate boot.
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 30s
      disable: true
    # Graceful shutdown. Only effective when the orchestrator
    # (compose stops the container, K8s sends SIGTERM and
    # honours terminationGracePeriodSeconds) is also configured.
    stop_signal: SIGTERM
    stop_grace_period: 30s
    labels:
      <<: *app-labels
      component: api
      backup: 'false'

  # PostgreSQL: primary data store. Credentials come from
  # .env.prod (override the dev defaults devops/devops).
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devops}
      POSTGRES_USER: ${POSTGRES_USER:-devops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devops}
    env_file:
      - path: ./.env.prod
        required: false
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-devops}"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: '1.0'
    labels:
      app: devops-toolkit
      tier: data
      component: postgres
      # backup tooling can use `docker volume ls --filter label=backup`
      # to discover which named volumes to snapshot.
      backup: 'true'

  # Loki: log aggregation. Single-binary mode; suitable for dev/CI.
  loki:
    image: grafana/loki:2.8.0
    command: -config.file=/etc/loki/loki-config.yaml
    ports: ["3100:3100"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    mem_limit: 512m
    cpus: '0.5'

  # Promtail: ships local logs into Loki. Disabled by default in this
  # compose to keep resource usage low; uncomment + bind-mount log dirs
  # to enable.
  # promtail:
  #   image: grafana/promtail:2.8.0
  #   command: -config.file=/etc/promtail/promtail-config.yaml
  #   volumes:
  #     - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
  #     - ../logs:/logs:ro
  #   depends_on: [loki]

  # Prometheus: metrics scrape. Targets the devops-toolkit /metrics path
  # and the loki /metrics endpoint.
  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      # Auto-reload on rules change. Takes ~30s.
      - --web.enable-lifecycle
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    mem_limit: 512m
    cpus: '0.5'

  # Grafana: dashboards for Loki + Prometheus. Default admin/admin
  # unless GF_SECURITY_ADMIN_PASSWORD is set in .env.prod.
  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      # Auto-provision datasources + dashboards on boot.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    env_file:
      - path: ./.env.prod
        required: false
    depends_on:
      - prometheus
      - loki
    volumes:
      # Provisioning config (datasources, dashboard provider).
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboard JSONs (read at boot + every 30s thereafter).
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 256m
    cpus: '0.5'

  # Alertmanager: routes alerts from Prometheus to the channels defined in
  # config-ci.yaml. Empty receivers by default.
  alertmanager:
    image: prom/alertmanager:latest
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports: ["9093:9093"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    environment:
      # Set in compose override or .env.prod to enable PagerDuty routing.
      PAGERDUTY_SERVICE_KEY: ${PAGERDUTY_SERVICE_KEY:-}
    mem_limit: 256m
    cpus: '0.5'

  # LDAP: bitnami/openldap, bootstrap via tests/fixtures/ldap/00-users.ldif.
  ldap:
    image: bitnami/openldap:2.6
    environment:
      LDAP_ROOT: ${LDAP_ROOT:-dc=example,dc=com}
      LDAP_ADMIN_USERNAME: ${LDAP_ADMIN_USERNAME:-admin}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-admin}
    env_file:
      - path: ./.env.prod
        required: false
    ports: ["389:1389"]
    volumes:
      - ../tests/fixtures/ldap/00-users.ldif:/ldifs/00-users.ldif:ro
    mem_limit: 256m
    cpus: '0.5'

  # Redis: cache + session store. Empty password in dev.
  redis:
    image: redis:7
    ports: ["6379:6379"]
    mem_limit: 256m
    cpus: '0.5'

  # Backup: nightly pg_dump via the host's
  # scripts/backup-postgres.sh. Runs inside the
  # postgres:15 image so pg_dump is in PATH without
  # having to install it; the cron schedule is set
  # dynamically (the crontab line is rebuilt every
  # container start) so BACKUP_CRON (default
  # "0 2 * * *") can be overridden via .env.prod.
  # The /backups volume is bind-mounted into a
  # sibling named volume so `docker volume ls`
  # surfaces it as a first-class backup target.
  backup:
    image: postgres:15
    mem_limit: 512m
    cpus: '0.5'
    volumes:
      - ../scripts/backup-postgres.sh:/backup.sh:ro
      - backups:/backups
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "$$(printf '%d' $$(( $$(date +%M) ))) $$(printf '%d' $$(( $$(date +%H) * 60 + $$(date +%M) ))) * * * /backup.sh --target=local" > /etc/crontabs/root
        echo "INFO: backup schedule: $$(cat /etc/crontabs/root)"
        crond -f -l 2
    env_file:
      - path: ./.env.prod
        required: false
    environment:
      PG_URL: ${PG_URL:-postgres://${POSTGRES_USER:-devops}:${POSTGRES_PASSWORD:-devops}@postgres:5432/${POSTGRES_DB:-devops}?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: devops-toolkit-net

volumes:
  pgdata: {}
  prometheus-data: {}
  loki-data: {}
  grafana-data: {}
  alertmanager-data: {}
  redis-data: {}
  influxdb-data: {}
  ldap-data: {}
  backups: {}
