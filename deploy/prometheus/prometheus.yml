# deploy/prometheus/prometheus.yml — scrape config + alert rules.
#
# Rules live under /etc/prometheus/rules/ (mounted from
# ./deploy/prometheus/rules in docker-compose). Recursion
# is on so each *.yml file in that directory is loaded.
# Add a new file rather than appending to alerts.yml so
# teams can own their own rule files.
#
# Alertmanager is wired as the single alerting target.
# Prometheus also scrapes the alertmanager's own
# /metrics endpoint so the alertmanager_down rule can
# fire (who watches the watchers).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: devops-toolkit
    # host.docker.internal works because the prometheus container
    # has extra_hosts: ["host.docker.internal:host-gateway"] in
    # docker-compose.yml. If you run prometheus outside docker,
    # change this to localhost:3000.
    static_configs:
      - targets: ["host.docker.internal:3000"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
