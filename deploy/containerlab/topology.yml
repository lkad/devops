# deploy/containerlab/topology.yml — 8-node containerlab topology.
#
# Implements docs/TEST-ENVIRONMENT.md §2.1 in full: 2 DC × 4 nodes
# (1 core switch + 3 physical hosts per DC). The core switches use
# network-multitool (alpine + ping/curl/iperf) for L3 health checks;
# the 6 physical hosts use linuxserver/openssh-server so the SSHProber
# in internal/physicalhost/prober has a real SSH daemon to talk to.
#
# PUBLIC_KEY is the prober's public key — generated via
#   ssh-keygen -t ed25519 -f deploy/secrets/prober/id_ed25519
# and NOT committed (only id_ed25519.pub is referenced here for
# documentation; the actual PUBLIC_KEY in containerlab is set from
# the .pub file at deploy time, see scripts/dev-env-up.sh).
name: devops-toolkit-clab
prefix: clab
mgmt:
  network: devops-mgmt-v2
  ipv4-subnet: 172.31.30.0/24

topology:
  kinds:
    linux:
      cmd: /bin/bash
  nodes:
    # ---- DC1 ----
    dc1-core-switch:
      kind: linux
      image: linuxserver/openssh-server:latest
      labels:
        role: core_switch
        dc: dc1
        env: test
    dc1-web-21:
      kind: linux
      image: linuxserver/openssh-server:latest
      labels:
        role: physical_host
        dc: dc1
        env: test
        app: web
      env:
        PUBLIC_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIgtfxreh/nz9lO/kwEQlwPJdcD+sWNKOC/mTNAHNmJc prober@devops-toolkit"
      ports:
        - "2221:22/tcp"
    dc1-db-22:
      kind: linux
      image: linuxserver/openssh-server:latest
      labels:
        role: physical_host
        dc: dc1
        env: test
        app: db
      env:
        PUBLIC_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIgtfxreh/nz9lO/kwEQlwPJdcD+sWNKOC/mTNAHNmJc prober@devops-toolkit"
      ports:
        - "2222:22/tcp"
    dc1-app-23:
      kind: linux
      image: linuxserver/openssh-server:latest
      labels:
        role: physical_host
        dc: dc1
        env: test
        app: app
      env:
        PUBLIC_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIgtfxreh/nz9lO/kwEQlwPJdcD+sWNKOC/mTNAHNmJc prober@devops-toolkit"
      ports:
        - "2223:22/tcp"
      ports:
        - "2223:22/tcp"

    # ---- DC2 ----
    dc2-core-switch:
      kind: linux
      image: linuxserver/openssh-server:latest
      labels:
        role: core_switch
        dc: dc2
        env: test
    dc2-web-41:
      kind: linux
      image: linuxserver/openssh-server:latest
      labels:
        role: physical_host
        dc: dc2
        env: test
        app: web
      env:
        PUBLIC_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIgtfxreh/nz9lO/kwEQlwPJdcD+sWNKOC/mTNAHNmJc prober@devops-toolkit"
      ports:
        - "2241:22/tcp"
    dc2-db-42:
      kind: linux
      image: linuxserver/openssh-server:latest
      labels:
        role: physical_host
        dc: dc2
        env: test
        app: db
      env:
        PUBLIC_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIgtfxreh/nz9lO/kwEQlwPJdcD+sWNKOC/mTNAHNmJc prober@devops-toolkit"
      ports:
        - "2242:22/tcp"
    dc2-app-43:
      kind: linux
      image: linuxserver/openssh-server:latest
      labels:
        role: physical_host
        dc: dc2
        env: test
        app: app
      env:
        PUBLIC_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIgtfxreh/nz9lO/kwEQlwPJdcD+sWNKOC/mTNAHNmJc prober@devops-toolkit"
      ports:
        - "2243:22/tcp"

  links:
    # DC1: core <-> each host
    - endpoints: ["dc1-core-switch:eth1", "dc1-web-21:eth1"]
    - endpoints: ["dc1-core-switch:eth2", "dc1-db-22:eth1"]
    - endpoints: ["dc1-core-switch:eth3", "dc1-app-23:eth1"]
    # DC2: core <-> each host
    - endpoints: ["dc2-core-switch:eth1", "dc2-web-41:eth1"]
    - endpoints: ["dc2-core-switch:eth2", "dc2-db-42:eth1"]
    - endpoints: ["dc2-core-switch:eth3", "dc2-app-43:eth1"]
    # Inter-DC: core-to-core (so probes can target either DC's hosts from
    # either side; containerlab places the link endpoints on the host's
    # data plane, not the mgmt plane — mgmt is for the prober to reach sshd)
    - endpoints: ["dc1-core-switch:eth4", "dc2-core-switch:eth4"]
