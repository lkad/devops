{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "devops-toolkit.fullname" . }}-backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:15
              command:
                - /bin/sh
                - -c
                - |
                  apk add --no-cache aws-cli bash || true
                  /scripts/backup-postgres.sh --target={{ .Values.backup.target }}
              envFrom:
                - secretRef:
                    name: {{ include "devops-toolkit.fullname" . }}-secrets
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: scripts
              configMap:
                name: {{ include "devops-toolkit.fullname" . }}-backup-scripts
                defaultMode: 0755
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-toolkit.fullname" . }}-backup-scripts
data:
  backup-postgres.sh: |
    {{- .Files.Get "scripts/backup-postgres.sh" | nindent 4 }}
{{- end }}
