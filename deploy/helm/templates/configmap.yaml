apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-toolkit.fullname" . }}-config
data:
  # config 是 nested map(见 values.yaml),用 toYaml 整体输出
  # 作为 config.yaml — app 端读这个文件而不是 env var。
  config.yaml: |-
    {{- toYaml .Values.config | nindent 4 }}
  # 顶层 key 转 env(便于 .envFrom 注入)
  {{- range $key, $value := .Values.config }}
  {{- if not (kindIs "map" $value) }}
  {{ $key | upper }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
