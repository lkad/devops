apiVersion: 1

# List of existing datasources to delete on startup. The provisioning
# provider is idempotent: a name in `datasources` below that already
# exists is updated (not skipped), so this is only needed to clean
# up leftover broken entries from earlier failed runs.
deleteDatasources:
  - name: PostgresDev

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: '15s'
      httpMethod: POST

  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    editable: true
    jsonData:
      version: Flux
      organization: devops-toolkit
      defaultBucket: metrics
      tlsSkipVerify: true
    secureJsonData:
      token: devops-toolkit-default-token

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      timeout: 60

  - name: Postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: devops
    secureJsonData:
      password: devops
    editable: true
    jsonData:
      database: devops
      sslmode: disable
      maxIdleConns: 2
      maxOpenConns: 10
      postgresVersion: 1500
      timescaledb: false
