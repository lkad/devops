# Grafana dashboard provider for DevOps Toolkit.
#
# Reads every JSON file under /var/lib/grafana/dashboards
# (mounted from ./deploy/grafana/dashboards) and exposes
# them in the Grafana UI under the "DevOps Toolkit" folder.
# Edits made in the UI are NOT persisted to the JSON files
# (allowUiUpdates: false) — change dashboards by editing
# the JSONs and re-deploying.

apiVersion: 1

providers:
  - name: 'DevOps Toolkit'
    orgId: 1
    folder: 'DevOps Toolkit'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
